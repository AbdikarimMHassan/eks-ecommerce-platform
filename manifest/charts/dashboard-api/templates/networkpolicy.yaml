apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: dashboard-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8086
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP