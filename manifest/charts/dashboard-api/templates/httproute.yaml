apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-api
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik
  hostnames:
    - {{ .Values.ingress.host }}
  rules:
    - backendRefs:
        - name: dashboard-api
          port: {{ .Values.service.port }}
