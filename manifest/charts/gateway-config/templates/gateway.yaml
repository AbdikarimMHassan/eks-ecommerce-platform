apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      port: 8443
      protocol: HTTPS
      hostname: {{ .Values.wildcardHostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - name: {{ .Values.tlsSecretName }}
            kind: Secret
