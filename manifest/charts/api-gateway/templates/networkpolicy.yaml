apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - port: 8081
    - to:
        - podSelector:
            matchLabels:
              app: payment-service
      ports:
        - port: 8083
    - to:
        - podSelector:
            matchLabels:
              app: inventory-service
      ports:
        - port: 8082
    - to:
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 8084
    - to:
        - podSelector:
            matchLabels:
              app: shipping-service
      ports:
        - port: 8085
    - to:
        - podSelector:
            matchLabels:
              app: dashboard-api
      ports:
        - port: 8086
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP