apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: worker
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service-name
                value: worker
        - setWeight: 100
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: SQS_QUEUE_URL
              value: {{ .Values.env.SQS_QUEUE_URL }}
            - name: HEALTH_PORT
              value: {{ .Values.env.HEALTH_PORT | quote }}
            - name: INVENTORY_SERVICE_URL
              value: {{ .Values.env.INVENTORY_SERVICE_URL }}
            - name: PAYMENT_SERVICE_URL
              value: {{ .Values.env.PAYMENT_SERVICE_URL }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ .Values.env.NOTIFICATION_SERVICE_URL }}
            - name: SHIPPING_SERVICE_URL
              value: {{ .Values.env.SHIPPING_SERVICE_URL }}
            - name: ORDER_SERVICE_URL
              value: {{ .Values.env.ORDER_SERVICE_URL }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3