apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: inventory-service
      ports:
        - port: 8082
    - to:
        - podSelector:
            matchLabels:
              app: payment-service
      ports:
        - port: 8083
    - to:
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 8084
    - to:
        - podSelector:
            matchLabels:
              app: shipping-service
      ports:
        - port: 8085
    - to:
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - port: 8081
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP