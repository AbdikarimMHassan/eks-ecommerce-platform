apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shipping-service
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: shipping-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: worker
      ports:
        - port: 8085
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP