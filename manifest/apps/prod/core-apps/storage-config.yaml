apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbdikarimMHassan/eks-ecommerce-platform
    targetRevision: main
    path: manifest/charts/storage-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
