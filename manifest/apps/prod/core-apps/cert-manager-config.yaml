apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbdikarimMHassan/eks-ecommerce-platform
    targetRevision: main
    path: eks-ecommerce-platform/manifest/charts/cert-manager-config
    helm:
      valueFiles:
        - ../../../environments/prod/cert-manager-config-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
