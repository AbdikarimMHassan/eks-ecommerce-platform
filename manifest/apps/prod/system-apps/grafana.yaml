apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 7.3.0
    helm:
      values: |
        adminPassword: changeme
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - grafana.abdikarim-tech.co.uk
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.abdikarim-tech.co.uk
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
                isDefault: true
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
        persistence:
          enabled: true
          storageClassName: gp3
          size: 10Gi
        # ReadWriteOnce storage + a rolling update strategy deadlocks with a
        # single replica: the new pod can't attach the still-in-use volume
        # until the old one terminates, but a RollingUpdate brings the new
        # one up first. Recreate tears down the old pod before starting the
        # new one, avoiding the multi-attach conflict entirely.
        strategy:
          type: Recreate
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true