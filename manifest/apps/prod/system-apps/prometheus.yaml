apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.0.0
    helm:
      skipCrds: true
      values: |
        grafana:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # automated sync temporarily disabled - selfHeal kept re-triggering
    # overlapping sync attempts before the chart's admission-webhook
    # PreSync hook resources could finish being created and cleaned up,
    # so the sync never reached the step that creates the actual
    # Prometheus/Alertmanager custom resources. Doing one clean, isolated
    # manual sync instead, then restoring this once it's confirmed healthy.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true