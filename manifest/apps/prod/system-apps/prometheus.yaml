apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.0.0
    helm:
      skipCrds: true
      values: |
        grafana:
          enabled: false
        # The chart's admission-webhook cert bootstrapping (a PreSync/PostSync
        # Job plus its own ServiceAccount/ClusterRole/ClusterRoleBinding/
        # Role/RoleBinding) is a known, commonly-hit friction point between
        # ArgoCD and this chart: ArgoCD never runs the "delete existing copy
        # first" half of the hook's own before-hook-creation delete policy
        # for these cluster-scoped RBAC objects, so every sync's PreSync
        # phase permanently fails with "already exists" and the sync never
        # reaches the step that creates the actual Prometheus/Alertmanager
        # custom resources. This only gates a validation safety net for
        # PrometheusRule/Prometheus/Alertmanager objects at admission time -
        # the operator functions fully without it - so it's disabled here
        # rather than fought.
        prometheusOperator:
          admissionWebhooks:
            enabled: false
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # automated sync temporarily disabled while confirming the fix above -
    # restore automated: {prune: true, selfHeal: true} once this Application
    # is confirmed Synced/Healthy with Prometheus/Alertmanager actually running.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true