name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
  workflow_dispatch: {}

env:
  AWS_REGION: eu-west-2
  ECR_PUSH_ROLE_ARN: arn:aws:iam::461625527829:role/github-actions-ecr-push

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - dashboard-api
          - inventory-service
          - notification-services
          - order-service
          - payment-service
          - scheduler
          - shipping-service
          - worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image env vars
        run: |
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"
          echo "REPOSITORY=prod/${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}

      - name: Push image to ECR
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker push "${{ env.REGISTRY }}/${{ env.REPOSITORY }}:latest"

      - name: Install yq
        run: |
          sudo curl -sL "https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update manifest with new image tag
        run: |
          git config user.name "Abdikarim"
          git config user.email "abdikarimmh98@gmail.com"

          yq e -i '.image.tag = strenv(IMAGE_TAG)' "manifest/environments/prod/${{ matrix.service }}-values.yaml"

          if git diff --quiet; then
            echo "Manifest already at this tag, nothing to commit."
            exit 0
          fi

          git add "manifest/environments/prod/${{ matrix.service }}-values.yaml"
          git commit -m "chore(${{ matrix.service }}): bump image tag to ${IMAGE_TAG} [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((RANDOM % 5 + 1))
          done
