apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: order-service
    - to:
        - podSelector:
            matchLabels:
              app: payment-service
    - to:
        - podSelector:
            matchLabels:
              app: inventory-service
    - to:
        - podSelector:
            matchLabels:
              app: notification-service
    - to:
        - podSelector:
            matchLabels:
              app: shipping-service
    - to:
        - podSelector:
            matchLabels:
              app: dashboard-api
    - to:
        - podSelector:
            matchLabels:
              app: redis
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP